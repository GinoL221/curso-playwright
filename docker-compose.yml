services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app:Z
    tmpfs:
      - /app/node_modules:exec,uid=${UID:-1000},gid=${GID:-1000}
    command: sh -c "npm ci --ignore-scripts && npx playwright test"
